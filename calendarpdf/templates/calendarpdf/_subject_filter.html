<div class="rounded-3 border bg-light p-3 mt-3">
  <div class="form-check">
    {{ form.filter_subjects }}
    <label class="form-check-label fw-semibold" for="{{ form.filter_subjects.id_for_label }}">
      {{ form.filter_subjects.label }} <span class="badge text-bg-secondary ms-1">Optional</span>
    </label>
  </div>
  <div id="subject-filter-fields" class="mt-3">
    <label class="form-label" for="{{ form.subject_filter.id_for_label }}">{{ form.subject_filter.label }}</label>
    {{ form.subject_filter }}
    <div class="form-text">{{ form.subject_filter.help_text }} If enabled but left empty, all subjects are included.</div>
    {% for error in form.subject_filter.errors %}<div class="text-danger small mt-2">{{ error }}</div>{% endfor %}
  </div>
</div>
