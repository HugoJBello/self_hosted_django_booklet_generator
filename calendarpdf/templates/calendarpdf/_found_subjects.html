{% if found_subjects %}
  <div class="alert alert-success mt-4 mb-0" role="status">
    <div class="fw-semibold mb-2"><i class="bi bi-check-circle me-1" aria-hidden="true"></i>Subjects included in the result</div>
    <div class="d-flex flex-wrap gap-2">
      {% for subject in found_subjects %}<span class="badge rounded-pill text-bg-light border text-dark">{{ subject }}</span>{% endfor %}
    </div>
  </div>
{% endif %}
