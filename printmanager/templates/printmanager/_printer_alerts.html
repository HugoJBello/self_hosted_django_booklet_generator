{% if status.alerts %}<section class="mb-3" aria-label="Alerts for {{ printer }}">{% for alert in status.alerts %}<div class="alert alert-{{ alert.severity }} d-flex gap-3 align-items-start mb-2 printer-live-alert" data-printer-alert="{{ printer.pk }}:{{ alert.code }}" role="alert"><i class="bi {{ alert.icon }} fs-4"></i><div><strong>{{ printer }} — {{ alert.title }}</strong><div>{{ alert.description }}</div><div class="small opacity-75 mt-1">Printer code: {{ alert.code }}</div></div></div>{% endfor %}</section>{% endif %}
