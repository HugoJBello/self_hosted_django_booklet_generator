services:
  pdf_manager:
    build: .
    container_name: pdf_manager
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - ./data:/app/data
      - ./data/cups/run:/run/cups
    environment:
      # ----------------------------------------------------
      # Django (MUY PERMISIVO)
      # ----------------------------------------------------
      DJANGO_SECRET_KEY: "dev-unsafe-secret-key"
      # Solo se usan si aún no existe este usuario. Cambia la contraseña tras el primer acceso.
      DJANGO_INITIAL_ADMIN_USERNAME: "admin"
      DJANGO_INITIAL_ADMIN_PASSWORD: "change_me"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"

      # Subpath fijo (si lo usas en settings)
      APP_SUBPATH: "/pdf_manager"

      # Persistencia
      DJANGO_DB_PATH: "/app/data/db.sqlite3"
      DJANGO_MEDIA_ROOT: "/app/data/media"
      # Socket del CUPS privado incluido en este despliegue.
      CUPS_SERVER: "/run/cups/cups.sock"
      CUPS_DISCOVERY_FILE: "/run/cups/discovered-printers.txt"

      # Proxy / Cloudflare / HTTPS (MUY PERMISIVO)
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://api-android18.hjbello.org,https://*.hjbello.org,https://*"
      DJANGO_COOKIE_SECURE: "False"
      DJANGO_SECURE_SSL_REDIRECT: "False"

      # Gunicorn
      GUNICORN_BIND: "0.0.0.0:8000"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "300"

      # ----------------------------------------------------
      # RQ / Redis
      # ----------------------------------------------------
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    depends_on:
      - redis
      - cups

  pdf_manager_worker:
    build: .
    container_name: pdf_manager_worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      # Mismos envs (para settings y rutas)
      DJANGO_SECRET_KEY: "dev-unsafe-secret-key"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      APP_SUBPATH: "/pdf_manager"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"
      DJANGO_MEDIA_ROOT: "/app/data/media"

      # Redis
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    depends_on:
      - redis
      - pdf_manager

    # ✅ Importante: con ENTRYPOINT=/entrypoint.sh, esto pasa args al script
    # y el script debe detectar "rqworker" y ejecutar "python manage.py rqworker default"
    command: ["rqworker", "default"]

  redis:
    image: redis:7-alpine
    container_name: pdf_manager_redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]

  cups:
    build:
      context: .
      dockerfile: docker/cups/Dockerfile
    container_name: pdf_manager_cups
    restart: unless-stopped
    # Necesario para recibir anuncios mDNS/Bonjour de impresoras de la LAN.
    network_mode: host
    volumes:
      - ./data/cups/etc:/etc/cups
      - ./data/cups/spool:/var/spool/cups
      - ./data/cups/cache:/var/cache/cups
      - ./data/cups/run:/run/cups
